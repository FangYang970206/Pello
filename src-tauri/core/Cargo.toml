[package]
name = "pello-core"
version = "0.1.12"
edition = "2021"
publish = false
description = "Pello workbench behavior shared by the Tauri shell"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
# The real path of a file in the form programs and the page expect: on Windows
# the extended form is left off, as Node's `realpathSync` leaves it off.
dunce = "1.0"
fancy-regex = "0.14"
getrandom = "0.2"
libc = "0.2"
portable-pty = "0.8"
rand = "0.8"
# The system's own folder dialog, as the Electron build's `dialog` module
# opens it: `IFileDialog` on Windows, the desktop's own on Linux and macOS.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "common-controls-v6"] }
russh = { version = "0.54", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# A TOML file is read whole, as smol-toml reads the Electron build's: a
# table nested under another is part of it, a comment ends a line, and a
# value keeps the escapes the format defines.
toml = { version = "0.8", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
# A URL is taken apart as Node's `new URL` takes one apart: this is that
# parser itself, so that what is shown of a server's URL, and whether a URL
# is taken at all, are the same down to the last domain-name rule.
ada-url = { version = "4", default-features = false, features = ["bundled", "std"] }
# A YAML file is read whole too: anchors, flow collections, quoted and
# block scalars, as the `yaml` package reads the Electron build's.
serde_yaml = "0.9"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }

[features]
default = ["ssh-rsa"]
# RSA host keys and user keys, as most SSH servers in use offer them.
ssh-rsa = ["russh/rsa"]

[target.'cfg(windows)'.dependencies]
# Pipes, IO and Security serve the behavior tests' stand-in `ssh` agent;
# Authorization gives private files an owner-only ACL. The shell opens files
# and links with what the system opens them with, as Electron's `shell` does;
# DataExchange, Memory and Ole are the clipboard a copied path is written to.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging" ] }

# The stand-in CLI reads the Windows console the way a native TUI does.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }
