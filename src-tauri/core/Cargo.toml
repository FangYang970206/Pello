[package]
name = "pello-core"
version = "0.1.12"
edition = "2021"
publish = false
description = "Pello workbench behavior shared by the Tauri shell"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
fancy-regex = "0.14"
getrandom = "0.2"
libc = "0.2"
portable-pty = "0.8"
rand = "0.8"
russh = { version = "0.54", default-features = false, features = ["ring"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
