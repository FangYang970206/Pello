name: Windows release candidate

on:
  workflow_dispatch:
    inputs:
      upgrade:
        description: Test an in-app upgrade from the original v0.1.13 runtime
        type: boolean
        default: false
      draft:
        description: Create a Release draft (run from a matching version tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    # The Electron rebuild toolchain supports Visual Studio 2022.
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Check version tag
        if: inputs.draft
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Run from a stable vX.Y.Z tag matching package.json to create a Release draft.'
          }
      - run: npm ci
      - run: npm run verify:prepare
      - uses: actions/upload-artifact@v7
        with:
          name: electron-build
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-prepare
          path: output/verification/
          if-no-files-found: ignore

  validate:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: behavior-1
            suite: behavior --shard=1/3
          - name: behavior-2
            suite: behavior --shard=2/3
          - name: behavior-3
            suite: behavior --shard=3/3
          - name: behavior-wsl
            suite: wsl
          - name: performance
            suite: performanceIsolated
          - name: installer
            suite: installation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Electron for behavioral checks
        run: |
          # Electron 33's extract-zip can exit early on current Node versions.
          $archive = node -e "const { version } = require('electron/package.json'); require('@electron/get').downloadArtifact({ version, artifactName: 'electron', platform: 'win32', arch: 'x64', checksums: require('electron/checksums.json') }).then(console.log, error => { console.error(error); process.exitCode = 1 })"
          if ($LASTEXITCODE -ne 0 -or !$archive) { throw 'Electron download failed.' }
          $name = Split-Path -Leaf $archive
          $checksum = node -p "require('electron/checksums.json')[process.argv[1]]" $name
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $checksum) { throw 'Invalid Electron archive checksum.' }
          Expand-Archive -LiteralPath $archive -DestinationPath node_modules/electron/dist -Force
          Set-Content -LiteralPath node_modules/electron/path.txt -Value 'electron.exe' -NoNewline -Encoding ascii
          node -e "require('node:fs').accessSync(require('electron'))"
      - uses: actions/download-artifact@v8
        with:
          name: electron-build
          path: out/
      - name: Set up Ubuntu WSL
        if: matrix.suite == 'wsl'
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          additional-packages: python3
      - name: Verify the WSL fixture
        if: matrix.suite == 'wsl'
        run: wsl.exe -- python3 --version
      - name: Package the verified build
        if: matrix.suite == 'installation'
        run: npm run dist:win -- --skip-build
      - name: Run checks
        run: node scripts/check-suite.mjs ${{ matrix.suite }}
      - name: Test in-app upgrade to the candidate version
        if: matrix.suite == 'installation' && (inputs.upgrade || inputs.draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.13 --pattern Pello-0.1.13-win-x64.zip --dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/update-upgrade-check.mjs
      - name: Collect release assets
        if: matrix.suite == 'installation'
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @(
            "Pello-$version-win-x64-setup.exe"
            "Pello-$version-win-x64-setup.exe.blockmap"
            "Pello-$version-win-x64.zip"
            'latest.yml'
          )
          New-Item -ItemType Directory -Path release
          foreach ($file in $files) { Copy-Item -LiteralPath "dist/$file" -Destination release }
          git archive --format=zip --output="release/Pello-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checksums = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          Set-Content release/SHA256SUMS.txt -Value (($checksums -join [char]10) + [char]10) -NoNewline -Encoding ascii
      - uses: actions/upload-artifact@v7
        if: matrix.suite == 'installation'
        with:
          name: windows-release-candidate
          path: release/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.name }}
          path: |
            output/verification/
            output/performance/
          if-no-files-found: ignore

  draft:
    if: inputs.draft
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release-candidate
          path: release/
      - name: Validate and attach the verified assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
