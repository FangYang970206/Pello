:root{--ui:'Geist','Segoe UI Variable','Segoe UI',system-ui,sans-serif;--mono:'Cascadia Mono','Cascadia Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',ui-monospace,monospace;
--r1:6px;--r2:8px;--ease:cubic-bezier(.2,.7,.2,1);--t:140ms}
[data-theme=dark]{color-scheme:dark;--bg:#0c0d0f;--side:#131417;--panel:#16171a;--elev:#1c1d21;--elev2:#232429;--hover:rgba(255,255,255,.045);--press:rgba(255,255,255,.075);--sel:rgba(255,255,255,.07);
--line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.1);--ctl:#686e7a;--text:#e8e9ec;--muted:#a3a7b0;--faint:#80858f;--accent:#8e96ff;--accent-ink:#0c0d18;--accent-soft:rgba(142,150,255,.14);
--green:#6fcf97;--red:#f07a7a;--amber:#e3b660;--blue:#7fb2ff;--magenta:#c99cf0;--cyan:#6fd0d6;--add:rgba(111,207,151,.09);--addm:rgba(111,207,151,.26);--del:rgba(240,122,122,.09);--delm:rgba(240,122,122,.28);--shadow:0 16px 48px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35)}
[data-theme=light]{color-scheme:light;--bg:#fcfcfd;--side:#f3f3f5;--panel:#f8f8fa;--elev:#ffffff;--elev2:#f1f1f4;--hover:rgba(0,0,0,.04);--press:rgba(0,0,0,.07);--sel:rgba(0,0,0,.055);
--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.11);--ctl:#8a8f99;--text:#1a1b1e;--muted:#565b65;--faint:#666b75;--accent:#5355d1;--accent-ink:#fff;--accent-soft:rgba(83,85,209,.1);
--green:#1f8a4c;--red:#c93c3c;--amber:#9a6a00;--blue:#2c64c4;--magenta:#8a45b8;--cyan:#137d84;--add:rgba(31,138,76,.08);--addm:rgba(31,138,76,.2);--del:rgba(201,60,60,.07);--delm:rgba(201,60,60,.2);--shadow:0 16px 48px rgba(20,20,40,.16),0 2px 8px rgba(20,20,40,.08)}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html,body{height:100%}
body{font:13px/1.5 var(--ui);background:var(--side);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;min-width:1024px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:14px;height:14px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--r1)}
.mono{font-family:var(--mono)}
.grow{flex:1;min-width:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* shell */
#app{display:grid;grid-template-rows:40px 1fr;height:100vh}
#app.with-right .body{grid-template-columns:240px 1fr 296px}
.body{display:grid;grid-template-columns:240px 1fr;min-height:0}
.title{display:flex;align-items:center;background:var(--side);-webkit-app-region:drag;user-select:none}
.title .brand{width:240px;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:560;font-size:12px;letter-spacing:.01em}
.logo{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--accent),#b98cff);display:grid;place-items:center;color:#fff}
.logo svg{width:11px;height:11px;stroke-width:2}
.title .crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}

 <label class="fld" style="margin:0"><span>默认 Agent</span><select class="sel" data-np="agent">${[...PRESETS,...D.custom].map(a=>`<option value="${a.id}" ${NP.agent===a.id?'selected':''} ${a.installed===false?'disabled':''}>${esc(a.name)}${a.installed===false?'（未找到命令）':''}</option>`).join('')}<option value="shell" ${NP.agent==='shell'?'selected':''}>仅 Shell</option></select><small>新建终端时预选，可随时更换。</small></label>`,
 `<span class="grow"></span><button class="btn ghost" data-a="mclose">取消</button><button class="btn pri" data-a="np-ok" ${ok?'':'disabled style="opacity:.45;pointer-events:none"'}>创建项目</button>`);}
function readNP(){$$('[data-np]').forEach(i=>NP[i.dataset.np]=i.value);}
/* host dialog */
let HE=null;
function hostModal(id){const h=D.hosts.find(x=>x.id===id);HE=h?structuredClone(h):{id:'',name:'',addr:'',user:'',os:'Windows Server 2022',on:false,port:22};
 modal(h?h.name:'添加机器',`<div class="two"><label class="fld"><span>名称</span><input class="tx" data-he="name" value="${esc(HE.name)}" placeholder="build-02"></label><label class="fld"><span>用户</span><input class="tx mono" data-he="user" value="${esc(HE.user)}" placeholder="yang"></label></div><div class="two" style="grid-template-columns:1fr 96px"><label class="fld"><span>地址</span><input class="tx mono" data-he="addr" value="${esc(HE.addr)}" placeholder="host.intranet"></label><label class="fld"><span>端口</span><input class="tx mono" value="22" aria-label="端口"></label></div><label class="fld" style="margin:0"><span>认证</span><select class="sel"><option>SSH 密钥（~/.ssh/id_ed25519）</option><option>SSH Agent</option></select></label>`,
 `${h?`<button class="btn ghost" data-a="hdel" style="color:var(--red)">${I('trash','s')}移除</button>`:''}<span class="grow"></span>${h?`<button class="btn" data-a="hconn2">${h.on?'断开':'连接'}</button>`:''}<button class="btn" data-a="toast" data-id="SSH 连接正常（演示）">测试连接</button><button class="btn pri" data-a="hsave">${h?'保存':'添加'}</button>`,'',h?`<span class="tag"><span class="dot ${h.on?'running':'exited'}"></span>${h.on?'已连接':'未连接'}</span>`:'');}
/* custom executor */
let CE=null;const COLORS=['#c4aedb','#a9c3df','#95cfaa','#dcc07f','#e39e9c','#cdd0d6'];
function customModal(id){const c=D.custom.find(x=>x.id===id);CE=c?structuredClone(c):{id:'',name:'',cmd:'',args:'',shell:D.defShell,env:[],letter:'',color:COLORS[1]};CE.more=!!(c&&c.env.length);drawCE();}
function drawCE(out=''){const c=CE;modal(c.id?'编辑执行器':'添加执行器',`<div class="two" style="grid-template-columns:1fr auto"><label class="fld"><span>名称</span><input class="tx" data-ce="name" value="${esc(c.name)}" placeholder="例如 内部 Agent"></label><div class="fld"><span>Shell</span><div class="seg" role="radiogroup" aria-label="Shell">${[['pwsh','PowerShell'],['cmd','CMD']].map(([k,t])=>`<button class="${c.shell===k?'on':''}" role="radio" aria-checked="${c.shell===k}" data-a="ces" data-id="${k}">${t}</button>`).join('')}</div></div></div>
 <div class="two"><label class="fld"><span>命令</span><input class="tx mono" data-ce="cmd" value="${esc(c.cmd)}" placeholder="my-agent"></label><label class="fld"><span>参数</span><input class="tx mono" data-ce="args" value="${esc(c.args)}" placeholder="--interactive"></label></div>
 <button class="disc" data-a="ce-more" aria-expanded="${c.more}">${I('chev','s chev'+(c.more?' open':''))}环境变量与外观${c.env.length?`<span class="tag">${c.env.length}</span>`:''}</button>
 ${c.more?`<div style="margin:-4px 0 16px 22px">${c.env.map((e,i)=>`<div class="env"><input class="tx mono" data-env="${i}" data-f="k" value="${esc(e.k)}" placeholder="KEY" aria-label="变量名"><input class="tx mono" type="${e.secret?'password':'text'}" data-env="${i}" data-f="v" value="${esc(e.v)}" placeholder="value" aria-label="变量值"><button class="ib ${e.secret?'on':''}" data-a="env-secret" data-id="${i}" aria-pressed="${e.secret}" title="${e.secret?'密钥（已隐藏）':'设为密钥'}" aria-label="设为密钥">${I('eye','s')}</button><button class="ib" data-a="env-del" data-id="${i}" aria-label="删除变量">${I('x','s')}</button></div>`).join('')}<button class="btn sm ghost" data-a="env-add" style="margin-left:-10px">${I('plus','s')}添加变量</button><div style="display:flex;gap:16px;align-items:flex-end;margin-top:12px"><label class="fld" style="margin:0;width:88px"><span>标识</span><input class="tx" data-ce="letter" maxlength="2" value="${esc(c.letter)}" placeholder="自动"></label><div class="fld" style="margin:0"><span>颜色</span><div class="sws">${COLORS.map(k=>`<button class="sw ${c.color===k?'on':''}" style="background:${k}" data-a="ce-color" data-id="${k}" aria-label="颜色 ${k}" aria-pressed="${c.color===k}"></button>`).join('')}</div></div></div></div>`:''}
 <div class="fld" style="margin:0"><span>测试输出</span><div class="out" id="ceout">${out||'<span class="c-d">“测试启动”会在当前项目目录中运行一次，并显示原始输出。</span>'}</div></div>`,
 `<button class="btn" data-a="ce-test">${I('play','s')}测试启动</button>${c.id?`<button class="btn ghost" data-a="ce-del" style="color:var(--red)">删除</button>`:''}<span class="grow"></span><button class="btn ghost" data-a="mclose">取消</button><button class="btn pri" data-a="ce-save">${c.id?'保存':'添加'}</button>`);}
function readCE(){$$('[data-ce]').forEach(i=>CE[i.dataset.ce]=i.value);$$('[data-env]').forEach(i=>CE.env[+i.dataset.env][i.dataset.f]=i.value);}
function testCE(){readCE();const c=CE;const cwd=proj()?.path||'C:\\dev';const p=c.shell==='cmd'?`${cwd}>`:`PS ${cwd}> `;const lines=[`<span class="c-ps">${esc(p)}</span>${esc(cmdline(c))}`];if(!c.cmd.trim()){lines.push('<span class="c-err">请先填写命令。</span>');$('#ceout').innerHTML=lines.join('\n');return;}const envs=c.env.filter(e=>e.k);
 const seq=[`<span class="c-m">${esc(c.cmd)}</span> 0.3.1 <span class="c-d">(演示输出)</span>`,`<span class="c-d">env: ${envs.map(e=>esc(e.k)+'='+(e.secret?'********':esc(e.v))).join('  ')||'（无）'}</span>`,'<span class="c-g">ready</span>','<span class="c-d">^C</span>','<span class="c-d">[测试结束 · 退出码 0]</span>'];$('#ceout').innerHTML=lines.join('\n');let i=0;const step=()=>{if(!$('#ceout'))return;lines.push(seq[i++]);$('#ceout').innerHTML=lines.join('\n');if(i<seq.length)setTimeout(step,220);};setTimeout(step,220);}
function toast(m){const n=document.createElement('div');n.className='toast';n.innerHTML=I('check','s')+esc(m);$('#toasts').append(n);setTimeout(()=>n.remove(),2600);}
/* events */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,p=proj();const cur=()=>T.find(t=>t.id===ui.act[ui.pid]);
 switch(a){
 case'bd':if(e.target===el)mclose();break;case'mclose':mclose();break;
 case'confirm':{const cb=confirmCb;$('#modal').innerHTML='';cb&&cb();break;}
 case'proj':ui.pid=id;ui.route='work';render();break;
 case'settings':ui.route='settings';render();break;case'settings-agents':$('#modal').innerHTML='';ui.route='settings';ui.sec='agents';render();break;
 case'back':ui.route='work';render();break;case'sec':ui.sec=id;render();$('.scontent').scrollTop=0;break;
 case'newproj':newProj();break;case'newterm':newTerm();break;
 case'quick':launch(p.agent,D.defShell);render();break;
 case'tab':ui.act[ui.pid]=id;drawCenter();drawRight();break;
 case'close':{const i=T.findIndex(t=>t.id===id);T.splice(i,1);if(ui.act[ui.pid]===id)ui.act[ui.pid]=T.filter(t=>t.pid===ui.pid).pop()?.id;render();break;}
 case'tfocus':if(!getSelection().toString())$(`[data-in]`)?.focus();break;
 case'ctrlc':ctrlC(cur());break;case'kill':kill(cur());break;case'restart':restart(cur());break;
 case'split':ui.split[ui.pid]=!ui.split[ui.pid];if(ui.split[ui.pid]&&T.filter(t=>t.pid===ui.pid&&t.type==='term').length<2){launch('shell',D.defShell);ui.act[ui.pid]=T.filter(t=>t.pid===ui.pid&&t.type==='term')[0].id;}drawCenter();break;
 case'right':ui.right=!ui.right;render();break;
 case'rmode':ui.rmode=id;drawRight();break;
 case'tog':ui.open[id]=!ui.open[id];drawRight();break;
 case'diff':{let t=T.find(x=>x.pid===ui.pid&&x.type==='diff'&&x.path===id);if(!t){const old=T.findIndex(x=>x.pid===ui.pid&&x.type==='diff'&&x.preview);t={id:uid('d'),type:'diff',pid:ui.pid,path:id,preview:true};if(old>=0)T.splice(old,1,t);else T.push(t);}ui.act[ui.pid]=t.id;drawCenter();drawRight();break;}
 case'dmode':ui.dmode=id;drawCenter();break;
 case'discard':confirmBox('放弃更改？',`<span class="mono">${esc(id)}</span> 的工作区修改将被还原（git restore），无法撤销。`,'放弃更改',()=>{CH[ui.pid]=changes().filter(f=>f.p!==id);T=T.filter(t=>!(t.type==='diff'&&t.path===id&&t.pid===ui.pid));ui.act[ui.pid]=T.filter(t=>t.pid===ui.pid).pop()?.id;render();toast('已放弃更改（演示）');});break;
 case'ntk':NT.kind=id;drawNT();break;case'nts':NT.shell=id;drawNT();break;
 case'nt-ok':$('#modal').innerHTML='';launch(NT.kind,NT.shell);render();break;
 case'nph':if(e.target.closest('[data-a=hconnect]'))break;readNP();if(hostOf(id).on){NP.host=id;drawNP();}else toast('请先连接该机器');break;
 case'hconnect':readNP();hostOf(id).on=true;NP.host=id;save();drawNP();toast(`已连接 ${hostOf(id).name}（演示）`);break;
 case'np-addhost':readNP();NP.addHost=!NP.addHost;drawNP();break;
 case'np-savehost':{readNP();const n=$('[data-nh=name]').value.trim()||'build-02',ad=$('[data-nh=addr]').value.trim()||'yang@build-02';const h={id:uid('h'),name:n,addr:ad.split('@').pop(),user:ad.includes('@')?ad.split('@')[0]:'yang',os:'Windows Server 2022',on:true};D.hosts.push(h);NP.host=h.id;NP.addHost=false;save();drawNP();break;}
 case'browse':readNP();NP.path=NP.host==='local'?'C:\\dev\\orca':'D:\\work\\billing';if(!NP.name)NP.name=NP.path.split('\\').pop();drawNP();break;
 case'np-ok':{readNP();const pr={id:uid('p'),name:NP.name.trim(),host:NP.host,path:NP.path.trim(),branch:'main',agent:NP.agent};D.projects.unshift(pr);save();$('#modal').innerHTML='';ui.pid=pr.id;ui.route='work';render();toast('已创建项目');break;}
 case'host':hostModal(id);break;
 case'hsave':{$$('[data-he]').forEach(i=>HE[i.dataset.he]=i.value);if(!HE.name)HE.name='build-02';const i=D.hosts.findIndex(h=>h.id===HE.id);if(i>=0)D.hosts[i]=HE;else D.hosts.push({...HE,id:uid('h')});save();$('#modal').innerHTML='';render();toast('已保存');break;}
 case'hconn2':{const h=hostOf(HE.id);h.on=!h.on;save();hostModal(h.id);render();hostModal(h.id);break;}
 case'hdel':confirmBox('移除机器？','使用这台机器的项目将无法打开终端。','移除',()=>{D.hosts=D.hosts.filter(h=>h.id!==HE.id);save();render();});break;
 case'custom':customModal(id);break;case'ce-more':readCE();CE.more=!CE.more;drawCE();break;
 case'ces':readCE();CE.shell=id;drawCE();break;case'env-add':readCE();CE.env.push({k:'',v:'',secret:false});drawCE();break;
 case'env-del':readCE();CE.env.splice(+id,1);drawCE();break;case'env-secret':readCE();CE.env[+id].secret=!CE.env[+id].secret;drawCE();break;
 case'ce-color':readCE();CE.color=id;drawCE();break;case'ce-test':testCE();break;
 case'ce-save':{readCE();if(!CE.name.trim()||!CE.cmd.trim()){toast('请填写名称和命令');break;}const c={...CE};delete c.more;c.letter=c.letter||c.name.trim()[0].toUpperCase();c.env=c.env.filter(e=>e.k);if(c.id){D.custom=D.custom.map(x=>x.id===c.id?c:x);}else{c.id=uid('c');D.custom.push(c);}save();$('#modal').innerHTML='';render();toast('已保存执行器');break;}
 case'ce-del':D.custom=D.custom.filter(x=>x.id!==CE.id);save();$('#modal').innerHTML='';render();break;
 case'swset':{const k=el.dataset.k;if(k.startsWith('plugin:')){const pl=D.plugins.find(x=>x.id===k.slice(7));pl.on=!pl.on;}else D[k]=!D[k];save();render();break;}
 case'theme':D.theme=id;save();render();break;
 case'toast':toast(id);break;
 case'min':case'max':break;}});
document.addEventListener('input',e=>{if(e.target.dataset.np){NP[e.target.dataset.np]=e.target.value;if(e.target.dataset.np==='path')$('#pchk').innerHTML=pathCheck();const ok=NP.name.trim()&&/^[a-z]:\\/i.test(NP.path.trim());const b=$('[data-a=np-ok]');b.disabled=!ok;b.style.cssText=ok?'':'opacity:.45;pointer-events:none';}});
document.addEventListener('change',e=>{const k=e.target.dataset.set;if(k){D[k]=k==='fontSize'?+e.target.value:e.target.value;save();render();}});
document.addEventListener('keydown',e=>{const t=e.target;
 if(t.dataset&&t.dataset.in){const s=T.find(x=>x.id===t.dataset.in);if(e.key==='Enter'){input(s,t.value);drawCenter();drawRight();e.preventDefault();}else if(e.ctrlKey&&e.key.toLowerCase()==='c'&&!getSelection().toString()){e.preventDefault();ctrlC(s);}return;}
 if(e.key==='Escape'&&$('#modal').innerHTML){mclose();return;}if(e.key==='Escape'&&ui.route==='settings'&&!t.matches('input,select')){ui.route='work';render();return;}
 if(e.key==='Enter'&&$('#modal [data-a=nt-ok]')&&!t.matches('button')){$('[data-a=nt-ok]').click();return;}
 if(e.ctrlKey&&!$('#modal').innerHTML){const k=e.key.toLowerCase();if(k==='n'){e.preventDefault();newProj();}else if(k==='t'){e.preventDefault();newTerm();}else if(k===','){e.preventDefault();ui.route='settings';render();}else if(k==='b'){e.preventDefault();ui.right=!ui.right;render();}}});
setInterval(()=>{const s=T.find(t=>t.id===ui.act[ui.pid]);const el=$('#elapsed');if(s&&el&&s.state==='running')el.textContent=fmt(Date.now()-s.start);},1000);
window.__errs=[];window.addEventListener('error',e=>__errs.push(String(e.message)));
/* seed */
(function(){const vg=D.projects.find(p=>p.id==='vg');if(vg){const a=launch('claude','pwsh',vg,{start:Date.now()-252000});const b=launch('codex','pwsh',vg);exit(b,0);const c=launch('shell','pwsh',vg);c.lines=[];c.lines.push(P(c,'git status --short'),...changes('vg').map(f=>L(`<span class="${f.st==='A'?'c-g':'c-r'}"> ${f.st}  ${esc(f.p)}</span>`)),P(c,''));c.atPrompt=true;ui.act.vg=a.id;}
 const sv=D.projects.find(p=>p.id==='svc');if(sv){const s=launch('codex','pwsh',sv,{start:Date.now()-61000});}})();
render();
</script></body></html>
